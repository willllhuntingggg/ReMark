<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Full bleed Squircle Background -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="#181A20" />
  
  <!-- Left Waypoint Mark (Trail Orange Dot) -->
  <circle cx="36" cy="64" r="16" fill="#FF5500" />
  
  <!-- Right Arrow Pointing Left to Mark -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Horizontal Shaft -->
    <line x1="60" y1="64" x2="108" y2="64" />
    <!-- Arrowhead Wings pointing left -->
    <polyline points="84,40 60,64 84,88" />
  </g>
</svg>
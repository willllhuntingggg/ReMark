<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReMark — Mark it now. Find it later.</title>
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="tailwind.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand"><span class="brand-title">ReMark</span></div>
      <div class="view-identity">
        <button id="source-back" class="source-back" type="button" style="display: none;" aria-label="返回 Mark 时间流">← 时间流</button>
        <span id="view-subtitle" class="view-subtitle">你的 Mark 时间流</span>
      </div>
    </header>
    <div class="controls-bar">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">/</span>
        <input type="text" id="search-input" placeholder="搜索 Mark、笔记、来源或时间点" aria-label="搜索 Mark">
        <button id="search-clear" class="clear-btn" type="button" aria-label="清除搜索" style="display: none;">×</button>
      </div>
    </div>
    <main class="content-area">
      <section id="panel-clips" class="tab-panel active">
        <div id="collection-context" class="collection-context" hidden></div>
        <div id="clips-container" class="clips-list" aria-live="polite"></div>
        <div id="clips-empty-state" class="empty-state" style="display: none;">
          <div class="empty-icon" aria-hidden="true">—</div>
          <h3>还没有留下 Mark</h3>
          <p>在网页中先按住 <strong>Command/Ctrl</strong>，再划选文字；在视频中按 <strong>Command/Ctrl+M</strong>。Mark 会自动出现在这里。</p>
        </div>
      </section>
    </main>
  </div>
  <script src="../lib/storage.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReMark Marquee Promo Tile</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <style>
    .asset { width: 1400px; height: 560px; }
    .brand { top: 46px; left: 54px; }
    .copy-block { position: absolute; top: 150px; left: 54px; z-index: 8; width: 560px; }
    .headline { font-size: 58px; }
    .copy { margin-top: 22px; font-size: 18px; max-width: 360px; }
    .rule { left: 56px; top: 126px; }
    .panel { right: 64px; top: 20px; width: 440px; height: 520px; transform: rotate(1.1deg); }
    .panel img { object-position: 0% 0%; }
    .caption-chip { left: 624px; top: 476px; }
    .marker.one { left: 522px; top: 316px; }
    .marker.two { left: 700px; top: 300px; width: 11px; height: 11px; }
    .marker.three { right: 516px; top: 282px; width: 12px; height: 12px; }
  </style>
</head>
<body>
  <main class="asset">
    <div class="brand"><span class="brand-dot"></span> ReMark</div>
    <div class="rule"></div>
    <section class="copy-block">
      <p class="eyebrow">A small way to remember</p>
      <h1 class="headline">Leave a mark.<br>Find your way back.</h1>
      <p class="copy">Save what catches your attention.</p>
    </section>

    <div class="panel-frame panel">
      <img src="../assets/raw/sidepanel-text-note.png" alt="The real ReMark Side Panel">
    </div>

    <span class="caption-chip"><span class="tiny-dot"></span>Mark it now. Find it later.</span>
    <span class="marker one"></span>
    <span class="marker two forest"></span>
    <span class="marker three"></span>

    <svg class="path" viewBox="0 0 1400 560" aria-hidden="true">
      <path d="M 536 322 C 620 312, 660 306, 852 294"></path>
      <path class="soft" d="M 470 400 C 640 440, 820 440, 960 420"></path>
      <circle cx="852" cy="294" r="3"></circle>
    </svg>
  </main>
</body>
</html>

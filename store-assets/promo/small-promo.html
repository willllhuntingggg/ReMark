<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReMark Small Promo Tile</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <style>
    .asset { width: 440px; height: 280px; }
    .brand { top: 24px; left: 26px; font-size: 11px; }
    .brand .brand-dot { width: 8px; height: 8px; }
    .copy-block { position: absolute; top: 74px; left: 26px; z-index: 8; width: 230px; }
    .headline { font-size: 27px; }
    .panel { right: 22px; bottom: 20px; width: 148px; height: 118px; transform: rotate(-0.8deg); }
    .panel img { object-position: 0% 22%; }
    .marker.one { left: 250px; top: 122px; width: 11px; height: 11px; }
    .marker.two { left: 270px; top: 178px; width: 9px; height: 9px; }
  </style>
</head>
<body>
  <main class="asset">
    <div class="brand"><span class="brand-dot"></span> ReMark</div>
    <section class="copy-block">
      <h1 class="headline">Leave a mark.<br>Find your way back.</h1>
    </section>

    <div class="panel-frame panel">
      <img src="../assets/raw/sidepanel-text-note.png" alt="A real ReMark Side Panel fragment">
    </div>

    <span class="marker one"></span>
    <span class="marker two forest"></span>

    <svg class="path" viewBox="0 0 440 280" aria-hidden="true">
      <path d="M 255 128 C 300 150, 320 180, 312 216 S 300 246, 292 252"></path>
      <circle cx="313" cy="214" r="2.5" class="forest"></circle>
    </svg>
  </main>
</body>
</html>

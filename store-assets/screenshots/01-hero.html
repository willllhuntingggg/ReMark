<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReMark Store Screenshot — Hero</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <style>
    .asset { width: 1280px; height: 800px; }
    .brand { top: 42px; left: 58px; }
    .copy-block { position: absolute; top: 150px; left: 80px; z-index: 8; width: 410px; }
    .headline { font-size: 64px; }
    .copy { margin-top: 24px; font-size: 18px; max-width: 310px; }
    .rule { left: 82px; top: 126px; }
    .article { left: 465px; top: 78px; width: 560px; height: 652px; transform: rotate(-1.3deg); }
    .article .ui-shot { object-position: 51% 53%; }
    .panel { right: 62px; top: 184px; width: 252px; height: 298px; transform: rotate(1.4deg); }
    .caption-chip { left: 618px; top: 672px; }
    .marker.one { left: 733px; top: 397px; }
    .marker.two { right: 151px; top: 268px; width: 11px; height: 11px; }
  </style>
</head>
<body>
  <main class="asset">
    <div class="brand"><span class="brand-dot"></span> ReMark</div>
    <div class="rule"></div>
    <section class="copy-block">
      <p class="eyebrow">A small way to remember</p>
      <h1 class="headline">Leave a mark.<br>Find your way back.</h1>
      <p class="copy">Save the things worth coming back to.</p>
    </section>

    <div class="ui-frame article">
      <img class="ui-shot" src="../assets/raw/article-highlight.png" alt="A real ReMark text highlight in an article">
    </div>
    <div class="panel-frame panel">
      <img src="../assets/raw/sidepanel-text-note.png" alt="The real ReMark Side Panel with the matching Mark">
    </div>

    <span class="caption-chip"><span class="tiny-dot"></span>A thought, kept in context</span>
    <span class="marker one"></span>
    <span class="marker two forest"></span>

    <svg class="path" viewBox="0 0 1280 800" aria-hidden="true">
      <path d="M 745 405 C 862 470, 962 430, 1082 320 S 1130 288, 1152 282"></path>
      <path class="soft" d="M 560 610 C 640 700, 780 706, 900 652"></path>
      <circle cx="1084" cy="318" r="3"></circle>
    </svg>
  </main>
</body>
</html>

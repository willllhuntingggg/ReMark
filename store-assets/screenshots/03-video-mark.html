<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReMark Store Screenshot — Video Mark</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <style>
    .asset { width: 1280px; height: 800px; }
    .brand { top: 42px; left: 58px; }
    .copy-block { position: absolute; top: 190px; left: 80px; z-index: 8; width: 400px; }
    .headline { font-size: 60px; }
    .copy { margin-top: 24px; font-size: 18px; max-width: 320px; }
    .rule { left: 82px; top: 164px; }
    .video { left: 492px; top: 116px; width: 700px; height: 394px; transform: rotate(-0.9deg); }
    .video .ui-shot { object-position: 50% 42%; }
    .card { left: 566px; top: 548px; width: 320px; height: 54px; transform: rotate(0.7deg); }
    .caption-chip { left: 566px; top: 622px; }
    .marker.one { left: 988px; top: 400px; width: 13px; height: 13px; }
    .marker.two { left: 676px; top: 556px; width: 11px; height: 11px; }
  </style>
</head>
<body>
  <main class="asset">
    <div class="brand"><span class="brand-dot"></span> ReMark</div>
    <div class="rule"></div>
    <section class="copy-block">
      <p class="eyebrow">Video Marks</p>
      <h1 class="headline">Mark a moment.</h1>
      <p class="copy">Save a timestamp and come back to the exact moment later.</p>
    </section>

    <div class="ui-frame video">
      <img class="ui-shot" src="../assets/raw/youtube-video-mark.png" alt="A real YouTube video page from the product environment">
    </div>
    <div class="panel-frame card">
      <img src="../assets/raw/sidepanel-video-card.png" alt="The real ReMark video Mark card with its 1:07 timestamp">
    </div>

    <span class="caption-chip"><span class="tiny-dot"></span>1:07 · saved and waiting</span>
    <span class="marker one"></span>
    <span class="marker two forest"></span>

    <svg class="path" viewBox="0 0 1280 800" aria-hidden="true">
      <path d="M 1002 402 C 950 470, 900 520, 782 556 S 710 566, 686 566"></path>
      <path class="soft" d="M 540 500 C 620 620, 760 640, 880 600"></path>
      <circle cx="782" cy="556" r="3"></circle>
    </svg>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReMark Store Screenshot — Note</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <style>
    .asset { width: 1280px; height: 800px; }
    .brand { top: 42px; left: 58px; }
    .copy-block { position: absolute; top: 196px; left: 80px; z-index: 8; width: 400px; }
    .headline { font-size: 60px; }
    .copy { margin-top: 24px; font-size: 18px; max-width: 320px; }
    .rule { left: 82px; top: 170px; }
    .panel { left: 620px; top: 70px; width: 560px; height: 662px; transform: rotate(1.2deg); }
    .panel img { object-position: 0% 0%; }
    .caption-chip { left: 250px; top: 630px; }
    .marker.one { left: 680px; top: 260px; }
    .marker.two { left: 680px; top: 340px; }
  </style>
</head>
<body>
  <main class="asset">
    <div class="brand"><span class="brand-dot"></span> ReMark</div>
    <div class="rule"></div>
    <section class="copy-block">
      <p class="eyebrow">Notes</p>
      <h1 class="headline">Leave a thought.</h1>
      <p class="copy">Add a note to remember why you marked it.</p>
    </section>

    <div class="panel-frame panel">
      <img src="../assets/raw/sidepanel-text-note.png" alt="The real ReMark Side Panel with a Mark and its attached Note">
    </div>

    <span class="caption-chip"><span class="tiny-dot"></span>A thought, attached to the Mark</span>
    <span class="marker one forest"></span>
    <span class="marker two"></span>

    <svg class="path" viewBox="0 0 1280 800" aria-hidden="true">
      <path d="M 690 352 C 560 400, 430 520, 330 636"></path>
      <circle cx="430" cy="520" r="3" class="forest"></circle>
    </svg>
  </main>
</body>
</html>

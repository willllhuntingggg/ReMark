<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReMark Store Screenshot — Find Your Way Back</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <style>
    .asset { width: 1280px; height: 800px; }
    .brand { top: 42px; left: 58px; }
    .copy-block { position: absolute; top: 62px; left: 80px; z-index: 8; width: 470px; }
    .eyebrow { font-size: 11px; }
    .headline { font-size: 46px; }
    .copy { margin-top: 18px; font-size: 17px; max-width: 360px; }
    .rule { left: 82px; top: 40px; }
    .panel { left: 70px; top: 210px; width: 400px; height: 473px; transform: rotate(-1.2deg); }
    .panel img { object-position: 0% 0%; }
    .article { right: 70px; top: 90px; width: 560px; height: 652px; transform: rotate(1deg); }
    .article .ui-shot { object-position: 50% 42%; }
    .caption-chip.a { left: 96px; top: 640px; }
    .caption-chip.b { left: 806px; top: 652px; }
    .marker.one { left: 263px; top: 380px; width: 13px; height: 13px; }
    .marker.two { left: 920px; top: 408px; }
  </style>
</head>
<body>
  <main class="asset">
    <div class="brand"><span class="brand-dot"></span> ReMark</div>
    <div class="rule"></div>
    <section class="copy-block">
      <p class="eyebrow">Coming back is the point</p>
      <h1 class="headline">Find your way back.</h1>
      <p class="copy">Click a Mark and jump straight back to where you left it.</p>
    </section>

    <div class="panel-frame panel">
      <img src="../assets/raw/sidepanel-text-note.png" alt="A Mark selected in the real ReMark Side Panel">
    </div>
    <div class="ui-frame article">
      <img class="ui-shot" src="../assets/raw/article-highlight.png" alt="The original highlighted passage after returning">
    </div>

    <span class="caption-chip a"><span class="tiny-dot"></span>Mark in the Side Panel</span>
    <span class="caption-chip b"><span class="tiny-dot"></span>Back to the exact passage</span>
    <span class="marker one forest"></span>
    <span class="marker two"></span>

    <svg class="path" viewBox="0 0 1280 800" aria-hidden="true">
      <path d="M 280 392 C 420 330, 560 336, 700 372 S 880 468, 928 416"></path>
      <path class="arrow" d="M 916 404 L 928 416 L 914 428"></path>
      <circle cx="700" cy="360" r="3"></circle>
    </svg>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to ReMark</title>
<link rel="icon" href="assets/icons/icon48.png">
<link rel="stylesheet" href="welcome.css">
<script src="lib/i18n.js"></script>
<script src="lib/storage.js"></script>
<script src="welcome.js" defer></script>
</head>
<body>

  <!-- Quiet header: just the marker, no product name yet. -->
  <header class="site-head" aria-hidden="true">
    <span class="head-dot"></span>
  </header>

  <!-- The trail: a thin path that draws itself as you scroll. -->
  <svg id="trail" aria-hidden="true" focusable="false">
    <path id="trail-ghost" d=""></path>
    <path id="trail-line" d=""></path>
    <g id="trail-dots">
      <circle class="trail-dot" r="3"   data-anchor="#scene-discovery .trio li:nth-child(1)" />
      <circle class="trail-dot" r="3"   data-anchor="#scene-discovery .trio li:nth-child(2)" />
      <circle class="trail-dot" r="3"   data-anchor="#scene-discovery .trio li:nth-child(3)" />
      <circle class="trail-dot is-main" r="4.5" data-anchor="#scene-passing .marker-title" />
      <circle class="trail-dot" r="3"   data-anchor="#scene-remark .wordmark" />
      <circle class="trail-dot" r="3"   data-anchor="#scene-bridge .bridge-inner" />
    </g>
  </svg>

  <main>

    <!-- Scene 1 · Discovery -->
    <section class="scene" id="scene-discovery">
      <div class="scene-inner">
        <h1 class="reveal" data-i18n="welcome_s1_title"></h1>
        <ul class="trio">
          <li class="reveal" style="--d:.5s">
            <i class="trio-dot" style="--c:#FF5500"></i>
            <span data-i18n="welcome_s1_sentence"></span>
          </li>
          <li class="reveal" style="--d:.8s">
            <i class="trio-dot" style="--c:#3873B2"></i>
            <span data-i18n="welcome_s1_moment"></span>
          </li>
          <li class="reveal" style="--d:1.1s">
            <i class="trio-dot" style="--c:#468282"></i>
            <span data-i18n="welcome_s1_idea"></span>
          </li>
        </ul>
      </div>
    </section>

    <!-- Scene 2 · The problem & the marker -->
    <section class="scene" id="scene-passing">
      <div class="scene-inner">
        <p class="passing-line reveal" data-i18n="welcome_s2_later"></p>
        <p class="lost reveal" id="s2-lost" style="--d:.4s" data-i18n="welcome_s2_lost"></p>
        <div class="marker-turn">
          <h2 class="marker-title reveal" data-i18n="welcome_s2_marker_title"></h2>
          <p class="marker-body reveal" style="--d:.4s" data-i18n="welcome_s2_marker_body"></p>
        </div>
      </div>
    </section>

    <!-- Scene 3 · ReMark -->
    <section class="scene" id="scene-remark">
      <div class="scene-inner">
        <img class="brand-mark reveal" src="assets/icons/icon-transparent.svg" alt="" width="72" height="72">
        <h2 class="wordmark reveal" style="--d:.25s">ReMark</h2>
        <p class="motto reveal" style="--d:.55s" data-i18n="welcome_s3_motto"></p>
        <p class="quiet-note reveal" style="--d:1.1s" data-i18n="welcome_s3_note"></p>
      </div>
    </section>

    <!-- Bridge · into the existing onboarding -->
    <section class="scene scene-bridge" id="scene-bridge">
      <div class="scene-inner bridge-inner">
        <h2 class="reveal" data-i18n="welcome_bridge_title"></h2>
        <p class="bridge-hint reveal" style="--d:.3s" data-i18n="welcome_bridge_hint"></p>
        <button id="show-me-how" class="cta reveal" style="--d:.6s" type="button">
          <span data-i18n="welcome_bridge_cta"></span>
        </button>
        <p class="done-note" id="bridge-done" data-i18n="welcome_bridge_done" hidden></p>
      </div>
    </section>

  </main>

</body>
</html>
